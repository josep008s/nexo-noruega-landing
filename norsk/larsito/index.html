<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Larsito · NEXO NORSK</title>
  <meta name="description" content="Practica noruego hablado y comprensión oral con Larsito, el compañero de conversación de NEXO NORSK.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.nexonoruega.com/norsk/larsito/">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="stylesheet" href="/fonts/fonts.css">

  <style>
    :root{
      --noche:#0E1B26; --nieve:#F3F5F4; --aurora:#3FCB94; --fiordo:#2C5A72; --niebla:#8DA1AB;
      --blanco:#FFFFFF;
      --tinta-suave:rgba(14,27,38,.72);
      --linea-clara:rgba(14,27,38,.14);
      --sombra-clara:0 14px 34px rgba(14,27,38,.08);
      --alerta:#8F5A0F;
      --linea:rgba(14,27,38,.14);
      --sg:"Space Grotesk",system-ui,sans-serif;
      --serif:"Source Serif 4",Georgia,serif;
      --caesar:"Caesar Dressing",var(--sg);
      --ease:cubic-bezier(0.16,1,0.3,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--serif);background:var(--nieve);color:var(--noche);line-height:1.6;min-height:100svh;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--aurora);color:var(--noche)}
    a{color:var(--fiordo)}
    a:focus-visible,button:focus-visible{outline:2px solid var(--fiordo);outline-offset:3px}

    header{position:sticky;top:0;z-index:60;background:rgba(243,245,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea-clara)}
    .head-inner{max-width:720px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .marca{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--noche)}
    .marca svg{width:26px;height:26px;flex:none}
    .marca span{font-family:var(--sg);font-weight:500;font-size:.9rem}
    .marca b{font-weight:700}
    .head-nav{display:flex;flex-wrap:wrap;gap:18px}
    .head-nav a{font-family:var(--sg);font-weight:500;font-size:.82rem;color:var(--fiordo);text-decoration:none}
    .head-nav a:hover{color:var(--noche)}

    main{max-width:720px;margin:0 auto;padding:28px 24px 100px;min-height:100svh}

    .kicker{font-family:var(--sg);font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--fiordo);margin-bottom:14px}
    h1{font-family:var(--sg);font-weight:700;font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:-.02em;line-height:1.14;margin-bottom:10px}
    h2{font-family:var(--sg);font-weight:700;font-size:1.16rem;letter-spacing:-.01em;margin-bottom:12px}
    .intro{color:var(--tinta-suave);font-size:1.05rem;margin-bottom:24px;max-width:54ch}

    .aviso{display:flex;gap:13px;align-items:flex-start;background:var(--blanco);border:1px solid var(--linea-clara);border-left:3px solid var(--alerta);border-radius:10px;padding:15px 17px;margin-bottom:26px}
    .aviso .eti{font-family:var(--sg);font-weight:700;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--alerta);flex:none;padding-top:3px}
    .aviso p{font-size:.96rem;color:var(--tinta-suave)}

    .back{background:none;border:none;color:var(--fiordo);font-family:var(--sg);font-size:.82rem;cursor:pointer;padding:0;margin-bottom:18px}
    .back:hover{color:var(--noche)}

    .step{animation:enter .4s var(--ease)}
    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* Elección de escenario */
    .cards{display:grid;gap:12px;margin-top:18px}
    .card{background:var(--blanco);border:1px solid var(--linea-clara);border-radius:12px;padding:17px;cursor:pointer;text-align:left;color:var(--noche);font-family:var(--serif);box-shadow:var(--sombra-clara);transition:border-color .2s,background .2s;width:100%}
    .card:hover{border-color:var(--aurora);background:rgba(63,203,148,.07)}
    .card .t{font-family:var(--sg);font-weight:700;font-size:1.04rem;display:block;margin-bottom:4px}
    .card .m{color:var(--tinta-suave);font-size:.93rem;display:block}
    .card .tag{font-family:var(--sg);font-weight:700;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--noche);background:rgba(63,203,148,.28);border-radius:999px;padding:3px 10px;display:inline-block;margin-top:10px}
    .card .tag.ex{background:rgba(44,90,114,.14);color:var(--fiordo)}

    /* Conversación */
    .chat{display:grid;gap:12px;margin:20px 0 24px}
    .burbuja{border-radius:14px;padding:14px 16px;max-width:88%;border:1px solid var(--linea-clara)}
    .burbuja.lars{background:var(--blanco);justify-self:start;border-bottom-left-radius:4px;box-shadow:var(--sombra-clara)}
    .burbuja.tu{background:rgba(63,203,148,.14);border-color:rgba(63,203,148,.38);justify-self:end;border-bottom-right-radius:4px}
    .burbuja .quien{font-family:var(--sg);font-weight:700;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fiordo);margin-bottom:5px}
    .burbuja .no{font-family:var(--sg);font-weight:500;font-size:1.04rem;line-height:1.45;color:var(--noche)}
    .burbuja .es{font-size:.92rem;color:var(--tinta-suave);font-style:italic;margin-top:5px}
    .burbuja .es[hidden]{display:none}
    .mini{background:none;border:none;color:var(--fiordo);font-family:var(--sg);font-size:.76rem;cursor:pointer;text-decoration:underline;padding:0;margin-top:8px}
    .mini:hover{color:var(--noche)}
    .fila-audio{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .onda{display:flex;align-items:flex-end;gap:3px;height:20px}
    .onda i{display:block;width:3px;border-radius:2px;background:var(--aurora)}

    .correccion{border-top:1px solid var(--linea-clara);margin-top:11px;padding-top:10px;font-size:.93rem;color:var(--tinta-suave)}
    .correccion b{color:var(--fiordo);font-family:var(--sg);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
    .correccion .bien{color:var(--noche);font-family:var(--sg)}

    /* Zona de respuesta */
    .responder{background:var(--blanco);border:1px solid var(--linea-clara);border-radius:14px;padding:17px;box-shadow:var(--sombra-clara)}
    .pista{font-size:.95rem;color:var(--tinta-suave);margin-bottom:12px}
    .pista b{color:var(--noche);font-family:var(--sg);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
    .bloques{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .bloque{font-family:var(--sg);font-size:.84rem;color:var(--noche);background:rgba(63,203,148,.16);border:1px solid rgba(63,203,148,.4);border-radius:999px;padding:5px 12px;cursor:pointer}
    .bloque-oir{font-family:var(--sg);font-size:.82rem;line-height:1;padding:7px 9px;border-radius:999px;border:1px solid var(--linea-clara);background:transparent;color:var(--fiordo);cursor:pointer;margin-left:-4px}
    .bloque-oir:hover{border-color:var(--aurora);color:var(--noche)}
    .bloque:hover{background:rgba(63,203,148,.28)}

    .mic{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;font-family:var(--sg);font-weight:700;font-size:1rem;color:var(--noche);background:var(--aurora);border:none;padding:16px 22px;border-radius:10px;cursor:pointer;transition:filter .18s,transform .15s}
    .mic:hover{filter:brightness(1.05)}
    .mic.grabando{background:var(--noche);color:var(--nieve)}
    .mic:disabled{opacity:.5;cursor:default}
    .mic .punto{width:11px;height:11px;border-radius:50%;background:currentColor;flex:none}
    .mic.grabando .punto{animation:latido 1.1s ease-in-out infinite}
    @keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}

    .campo{width:100%;background:var(--blanco);border:1px solid var(--linea-clara);border-radius:10px;padding:13px 15px;color:var(--noche);font-family:var(--sg);font-size:1.04rem;outline:none;margin-top:12px}
    .campo:focus{border-color:var(--fiordo)}
    .ayuda{font-family:var(--sg);font-size:.78rem;color:var(--fiordo);margin-top:9px}

    .btn{display:inline-block;width:100%;font-family:var(--sg);font-weight:700;font-size:1rem;color:var(--noche);background:var(--aurora);border:none;text-align:center;padding:14px 22px;border-radius:10px;cursor:pointer;margin-top:12px;text-decoration:none;transition:filter .18s}
    .btn:hover{filter:brightness(1.05)}
    .btn.ghost{background:none;border:1px solid var(--linea-clara);color:var(--noche)}
    .btn.ghost:hover{border-color:var(--fiordo)}
    .btn:disabled{opacity:.5;cursor:default}

    /* Listening */
    .ejercicio{background:var(--blanco);border:1px solid var(--linea-clara);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sombra-clara)}
    .ejercicio h3{font-family:var(--sg);font-weight:700;font-size:1.04rem;margin-bottom:6px}
    .ejercicio .meta{font-family:var(--sg);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fiordo);margin-bottom:12px}
    .ops{display:grid;gap:9px;margin-top:12px}
    .op{position:relative;background:var(--nieve);border:1px solid var(--linea-clara);border-radius:10px;padding:12px 15px;cursor:pointer;color:var(--noche);font-family:var(--serif);font-size:1.02rem;text-align:left;width:100%;transition:border-color .15s,background .15s}
    .op:hover:not(:disabled){border-color:var(--aurora)}
    .op.acierto{border-color:var(--aurora);background:rgba(63,203,148,.18)}
    .op.fallo{border-color:var(--fiordo);background:rgba(44,90,114,.10)}
    .op:disabled{cursor:default}
    .explica{margin-top:13px;background:rgba(63,203,148,.13);border-left:3px solid var(--aurora);border-radius:0 10px 10px 0;padding:14px 16px;font-size:.97rem;color:var(--noche)}
    .explica.mal{background:rgba(44,90,114,.09);border-left-color:var(--fiordo)}
    .pregunta-no{font-family:var(--sg);font-weight:700;font-size:1.04rem;margin-top:14px}
    .pregunta-es{color:var(--tinta-suave);font-size:.93rem;font-style:italic;margin-bottom:4px}
    .transcript{margin-top:12px;border-top:1px solid var(--linea-clara);padding-top:12px}
    .transcript p{font-size:.97rem;margin-bottom:8px}
    .transcript .no{font-family:var(--sg);color:var(--noche)}
    .transcript .es{color:var(--tinta-suave);font-style:italic}
    .agente-chat{max-height:360px;overflow:auto;margin:14px 0}
    .agente-panel audio{width:100%;margin:10px 0 4px}

    .cierre-panel{border-top:1px solid var(--linea-clara);margin-top:26px;padding-top:20px}
    .cierre-panel p{color:var(--tinta-suave);font-size:.98rem;margin-bottom:12px}

    @media (max-width:640px){
      .head-nav{gap:12px}
      .head-nav a{font-size:.76rem;padding:11px 0}
      .burbuja{max-width:100%}
    }
    @media (prefers-reduced-motion:reduce){
      .step{animation:none}
      .mic.grabando .punto{animation:none}
    }
    footer{border-top:1px solid var(--linea-clara);padding:32px 0;background:var(--nieve)}
    .foot-inner{max-width:860px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
    .foot-inner p{font-family:var(--sg);font-size:.78rem;color:var(--fiordo);margin:0}
    .footer-links{display:flex;flex-wrap:wrap;gap:20px}
    .footer-links a{font-family:var(--sg);font-size:.82rem;color:var(--fiordo);text-decoration:none}
    .footer-links a:hover{color:var(--noche)}
  </style>
</head>
