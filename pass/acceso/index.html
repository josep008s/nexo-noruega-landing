<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar acceso · NEXO PASS</title>
  <meta name="description" content="Recupera tu enlace de acceso a NEXO PASS con el correo de tu compra.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.nexonoruega.com/pass/acceso/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root{--noche:#0E1B26;--nieve:#F3F5F4;--aurora:#3FCB94;--fiordo:#2C5A72;--niebla:#8DA1AB;
      --blanco:#FFFFFF;--tinta-suave:rgba(14,27,38,.72);--linea-clara:rgba(14,27,38,.14);--alerta:#8F5A0F;
      --sg:"Space Grotesk",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,serif}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--serif);background:var(--nieve);color:var(--noche);line-height:1.6;min-height:100svh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
    main{max-width:480px;width:100%}
    .kicker{font-family:var(--sg);font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--fiordo);margin-bottom:16px}
    h1{font-family:var(--sg);font-weight:700;font-size:clamp(1.6rem,5vw,2.1rem);letter-spacing:-.02em;line-height:1.15;margin-bottom:12px}
    p{color:var(--tinta-suave);font-size:1.02rem;margin-bottom:12px}
    a{color:var(--fiordo)}
    a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--aurora);outline-offset:3px}
    input{width:100%;background:var(--blanco);border:1px solid var(--linea-clara);border-radius:8px;padding:15px 16px;color:var(--noche);font-family:var(--serif);font-size:1.05rem;outline:none;margin-top:8px}
    input:focus{border-color:var(--fiordo)}
    .btn{display:inline-block;width:100%;font-family:var(--sg);font-weight:700;font-size:1rem;color:var(--noche);background:var(--aurora);border:none;text-align:center;padding:15px 24px;border-radius:8px;cursor:pointer;margin-top:14px}
    .btn:disabled{opacity:.55;cursor:default}
    .nota{font-size:.9rem;margin-top:14px}
    [role="status"]{margin-top:14px;color:var(--noche)}
  </style>
</head>
<body>
  <main>
    <p class="kicker">Nexo Pass</p>
    <h1 id="titulo">Entra con tu correo</h1>
    <p id="intro">Escribe el correo con el que compraste y te reenviamos tu enlace de entrada.</p>
    <form id="f">
      <label for="email" style="font-family:var(--sg);font-size:.82rem;color:var(--tinta-suave)">Tu correo</label>
      <input id="email" type="email" autocomplete="email" required placeholder="tu@correo.com">
      <button class="btn" id="enviar" type="submit">Reenviar mi enlace</button>
    </form>
    <p role="status" aria-live="polite" id="msg"></p>
    <p class="nota">¿Todavía no tienes el curso? <a href="/pass/#precios">Aquí están los planes</a>. ¿Se te complicó algo? pass@nexonoruega.com</p>
  </main>
  <script>
  (function () {
    "use strict";
    var params = new URLSearchParams(window.location.search);
    if (params.get("e") === "expirado") {
      document.getElementById("titulo").textContent = "Ese enlace ya no vale";
      document.getElementById("intro").textContent = "O caducó tu ventana de acceso o el enlace es antiguo. Escribe tu correo: si tu acceso sigue activo te llega uno nuevo; si caducó, en la página del curso puedes reabrirlo.";
    }
    var f = document.getElementById("f");
    var btn = document.getElementById("enviar");
    var msg = document.getElementById("msg");
    f.addEventListener("submit", function (ev) {
      ev.preventDefault();
      btn.disabled = true;
      fetch("/api/norsk-reenviar/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) { msg.textContent = d.mensaje || "Si ese correo tiene un acceso activo, el enlace está de camino."; })
        .catch(function () { msg.textContent = "No se pudo enviar. Prueba de nuevo en unos segundos."; })
        .then(function () { setTimeout(function () { btn.disabled = false; }, 4000); });
    });
  })();
  </script>
</body>
</html>
